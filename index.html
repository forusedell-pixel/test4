<!DOCTYPE html>
<html>
<head>
  <title>Happy Birthday 🎉</title>

  <style>
    body {
      margin: 0;
      font-family: Arial;
      text-align: center;
      color: white;
      background: linear-gradient(to right, #4facfe, #00f2fe);
      overflow-x: hidden;
    }

    .page { display: none; padding-top: 80px; }
    .active { display: block; }

    .card {
      background: rgba(255,255,255,0.15);
      padding: 20px;
      margin: auto;
      border-radius: 15px;
      width: 80%;
      max-width: 350px;
    }

    input, button {
      padding: 10px;
      border-radius: 10px;
      border: none;
      margin-top: 10px;
    }

    button {
      background: white;
      color: #007BFF;
      cursor: pointer;
      font-weight: bold;
    }

    img {
      width: 200px;
      border-radius: 15px;
      margin: 10px;
    }

    #cake {
      width: 240px;
      cursor: pointer;
    }

    #flames {
      position: absolute;
      top: 10%;
      left: 50%;
      transform: translateX(-50%);
      font-size: 20px;
    }

    .spark {
      position: absolute;
      width: 6px;
      height: 6px;
      border-radius: 50%;
    }

  </style>
</head>

<body>

<!-- PAGE 1 -->
<div id="page1" class="page active">
  <div class="card">
    <h2>Enter Password 🔐</h2>
    <p>Hint: last 4 digits of something special 😉</p>
    <input type="password" id="pass">
    <br>
    <button onclick="checkPass()">Unlock</button>
    <p id="wrong"></p>
  </div>
</div>

<!-- PAGE 2 -->
<div id="page2" class="page">
  <div class="card">
    <h1>🎂 Happy Birthday 🎂</h1>
    <button onclick="startCelebration()">🎆 Surprise</button>

    <div id="bigMsg" style="display:none;">
      🎉 HAPPY BIRTHDAY 🎉 <br> Stay Happy Always 💙
    </div>

    <br>
    <button onclick="nextPage()">Next ➡️</button>
  </div>
</div>

<!-- PAGE 3 -->
<div id="page3" class="page">

  <h2>✨ Memories ✨</h2>

  <img src="https://picsum.photos/200">
  <img src="https://picsum.photos/201">
  <img src="https://picsum.photos/202">

  <!-- CAKE -->
  <div style="position:relative; display:inline-block; margin-top:20px;">

    <img id="cake"
      src="https://images.unsplash.com/photo-1599785209796-786432b228bc?w=500"
      onclick="blowCandle()">

    <div style="
      position:absolute;
      top:55%; left:50%;
      transform:translate(-50%,-50%);
      font-weight:bold;">
      YOUR NAME 💙
    </div>

    <div id="flames">🕯️ 🕯️ 🕯️</div>
  </div>

  <p id="cakeMsg" style="display:none;">🎉 Wish made! 🎂</p>

  <br>
  <button onclick="celebrate()">🎉 Let’s Celebrate</button>

</div>

<!-- AUDIO -->
<audio id="music" src="https://cdn.pixabay.com/download/audio/2022/03/15/audio_5c6c4b8c71.mp3"></audio>
<audio id="boom" src="https://cdn.pixabay.com/download/audio/2021/08/04/audio_c0a4a6d1a3.mp3"></audio>
<audio id="blow" src="https://cdn.pixabay.com/download/audio/2021/08/09/audio_884fe92c49.mp3"></audio>

<script>

function checkPass(){
  if(document.getElementById("pass").value === "1234"){
    document.getElementById("page1").classList.remove("active");
    document.getElementById("page2").classList.add("active");
  } else {
    document.getElementById("wrong").innerText="Wrong password";
  }
}

function nextPage(){
  document.getElementById("page2").classList.remove("active");
  document.getElementById("page3").classList.add("active");
}

function startCelebration(){
  let music = document.getElementById("music");
  music.currentTime = 0;
  music.play();

  document.getElementById("bigMsg").style.display="block";

  for(let i=0;i<5;i++){
    setTimeout(()=>{
      fireworks();
      playBoom();
    }, i*400);
  }
}

function playBoom(){
  let b = document.getElementById("boom");
  b.currentTime = 0;
  b.play();
}

function blowCandle(){
  let s = document.getElementById("blow");
  s.play();

  document.getElementById("flames").style.display="none";

  setTimeout(()=>{
    document.getElementById("cakeMsg").style.display="block";
    fireworks();
  },500);
}

function celebrate(){
  for(let i=0;i<7;i++){
    setTimeout(()=>{
      fireworks();
      playBoom();
    }, i*300);
  }
}

function fireworks(){
  for(let i=0;i<40;i++){
    let d=document.createElement("div");
    d.className="spark";
    document.body.appendChild(d);

    let x=window.innerWidth/2;
    let y=window.innerHeight/2;

    d.style.left=x+"px";
    d.style.top=y+"px";

    let angle=Math.random()*2*Math.PI;
    let dist=Math.random()*150;

    let dx=Math.cos(angle)*dist;
    let dy=Math.sin(angle)*dist;

    d.style.background=`hsl(${Math.random()*360},100%,60%)`;

    d.animate([
      {transform:"translate(0,0)",opacity:1},
      {transform:`translate(${dx}px,${dy}px)`,opacity:0}
    ],{duration:800});

    setTimeout(()=>d.remove(),800);
  }
}

</script>

</body>
</html>
